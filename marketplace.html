<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marketplace | HIT Marketplace</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        /* TOP BAR */

        .topbar {
            background: #0b376f;
            color: white;
            text-align: center;
            padding: 9px;
            font-size: 13px;
        }

        /* NAVBAR */

        nav {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5eaf1;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            text-decoration: none;
            color: #172033;
        }

        .brand-logo {
            width: 42px;
            height: 42px;

            background: #0b376f;
            color: white;

            border-radius: 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button,
        .nav-btn {
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .sell-btn {
            background: #0b376f;
            color: white;

            padding: 11px 18px;
            border-radius: 8px;

            font-weight: 700;
        }

        .logout-btn {
            background: #f1f3f7;
            color: #172033;

            padding: 11px 16px;
            border-radius: 8px;
        }

        /* PAGE */

        .container {
            width: 88%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            color: #0b376f;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #64748b;
        }

        /* SEARCH */

        .search-box {
            background: white;
            border: 1px solid #e5eaf1;
            border-radius: 12px;

            padding: 18px;

            display: grid;
            grid-template-columns: 1fr 180px 150px;
            gap: 12px;

            margin-bottom: 30px;
        }

        .search-box input,
        .search-box select {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d7dfea;
            border-radius: 8px;

            font-size: 14px;
            outline: none;
        }

        .search-box input:focus,
        .search-box select:focus {
            border-color: #0b376f;
        }

        /* PRODUCTS */

        #productsGrid {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(260px, 1fr));

            gap: 22px;
        }

        .product-card {
            background: white;

            border: 1px solid #e5eaf1;
            border-radius: 14px;

            overflow: hidden;

            transition: 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .product-image {
            width: 100%;
            height: 210px;

            object-fit: cover;

            background: #eef2f7;
        }

        .no-image {
            width: 100%;
            height: 210px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eef2f7;

            color: #64748b;
            font-size: 14px;
        }

        .product-content {
            padding: 18px;
        }

        .product-category {
            display: inline-block;

            background: #edf4ff;
            color: #0b376f;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 11px;
            font-weight: 700;

            margin-bottom: 10px;
        }

        .product-title {
            font-size: 19px;
            font-weight: 700;

            margin-bottom: 8px;

            color: #172033;
        }

        .product-description {
            color: #64748b;
            font-size: 13px;

            line-height: 1.5;

            min-height: 40px;

            margin-bottom: 14px;
        }

        .product-price {
            font-size: 22px;
            font-weight: 800;

            color: #0b376f;

            margin-bottom: 12px;
        }

        .seller {
            border-top: 1px solid #edf0f4;

            padding-top: 12px;

            font-size: 12px;
            color: #64748b;
        }

        .verified {
            color: #15803d;
            font-weight: 700;
        }

        .date {
            margin-top: 5px;
            color: #94a3b8;
        }

        /* STATUS */

        .message {
            text-align: center;

            padding: 50px 20px;

            color: #64748b;
        }

        .message h2 {
            color: #172033;
            margin-bottom: 8px;
        }

        .error {
            color: #b91c1c;
        }

        /* RESPONSIVE */

        @media (max-width: 750px) {

            nav {
                padding: 0 4%;
            }

            .brand-name {
                font-size: 16px;
            }

            .search-box {
                grid-template-columns: 1fr;
            }

            .container {
                width: 92%;
            }

            .nav-right {
                gap: 6px;
            }

            .sell-btn,
            .logout-btn {
                padding: 9px 11px;
            }
        }
    </style>
</head>


<body>

    <!-- TOP BAR -->

    <div class="topbar">
        🎓 HIT Student Marketplace • Buy. Sell. Connect.
    </div>


    <!-- NAVBAR -->

    <nav>

        <a href="index.html" class="brand">

            <div class="brand-logo">
                HIT
            </div>

            <div class="brand-name">
                HIT Marketplace
            </div>

        </a>


        <div class="nav-right">

            <a href="sell.html" class="sell-btn">
                + Sell Item
            </a>

            <button
                class="logout-btn"
                onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <!-- MAIN -->

    <main class="container">

        <div class="heading">

            <h1>
                Marketplace
            </h1>

            <p>
                Buy and sell items with verified HIT students.
            </p>

        </div>


        <!-- SEARCH / FILTER -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search items..."
                oninput="filterProducts()"
            >


            <select
                id="categoryFilter"
                onchange="filterProducts()">

                <option value="">
                    All Categories
                </option>

                <option value="Books">
                    Books
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Furniture">
                    Furniture
                </option>

                <option value="Clothing">
                    Clothing
                </option>

                <option value="Stationery">
                    Stationery
                </option>

                <option value="Others">
                    Others
                </option>

            </select>


            <select
                id="sortFilter"
                onchange="filterProducts()">

                <option value="newest">
                    Newest
                </option>

                <option value="low">
                    Price: Low → High
                </option>

                <option value="high">
                    Price: High → Low
                </option>

            </select>

        </div>


        <!-- PRODUCTS -->

        <div id="productsGrid">

            <div class="message">

                <h2>
                    Loading marketplace...
                </h2>

                <p>
                    Please wait.
                </p>

            </div>

        </div>

    </main>


    <script>

        /* =========================
           SUPABASE
        ========================= */

        const SUPABASE_URL =
            "https://ziyyqhnmhbwomibpsenf.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_i25Oy3Rbnzr3S45H4KzQyg_dLeEd3YH";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================
           VARIABLES
        ========================= */

        let allProducts = [];


        /* =========================
           AUTHENTICATION
        ========================= */

        async function checkUser() {

            const {
                data: { session },
                error
            } =
                await supabaseClient.auth.getSession();


            if (error || !session) {

                window.location.replace(
                    "login.html"
                );

                return null;
            }


            /* Check verification */

            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select("verification_status")
                    .eq("id", session.user.id)
                    .single();


            if (
                profileError ||
                !profile
            ) {

                await supabaseClient.auth.signOut();

                window.location.replace(
                    "login.html"
                );

                return null;
            }


            if (
                profile.verification_status !==
                "VERIFIED"
            ) {

                if (
                    profile.verification_status ===
                    "PENDING"
                ) {

                    window.location.replace(
                        "verify.html"
                    );

                } else {

                    await supabaseClient.auth.signOut();

                    alert(
                        "Your account is not verified."
                    );

                    window.location.replace(
                        "login.html"
                    );
                }

                return null;
            }


            return session;

        }


        /* =========================
           LOAD PRODUCTS
        ========================= */

        async function loadProducts() {

            const session =
                await checkUser();

            if (!session) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("listings")
                    .select("*")
                    .eq("status", "ACTIVE")
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(
                    "Listings error:",
                    error
                );

                document.getElementById(
                    "productsGrid"
                ).innerHTML = `

                    <div class="message error">

                        <h2>
                            Could not load marketplace
                        </h2>

                        <p>
                            ${escapeHtml(error.message)}
                        </p>

                    </div>

                `;

                return;
            }


            allProducts = data || [];

            displayProducts(
                allProducts
            );

        }


        /* =========================
           DISPLAY PRODUCTS
        ========================= */

        function displayProducts(
            products
        ) {

            const grid =
                document.getElementById(
                    "productsGrid"
                );


            if (!products.length) {

                grid.innerHTML = `

                    <div class="message">

                        <h2>
                            No items found
                        </h2>

                        <p>
                            There are currently no active listings.
                        </p>

                    </div>

                `;

                return;
            }


            grid.innerHTML =
                products.map(
                    product => {

                        const image =
                            product.image_url
                                ? `

                                <img
                                    class="product-image"
                                    src="${escapeHtml(product.image_url)}"
                                    alt="${escapeHtml(product.title)}"
                                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                                >

                                <div
                                    class="no-image"
                                    style="display:none;">
                                    Image unavailable
                                </div>

                                `
                                : `

                                <div class="no-image">
                                    No image
                                </div>

                                `;


                        const price =
                            Number(
                                product.price
                            ).toLocaleString(
                                "en-IN"
                            );


                        const date =
                            product.created_at
                                ? new Date(
                                    product.created_at
                                ).toLocaleDateString(
                                    "en-IN",
                                    {
                                        day: "numeric",
                                        month: "short",
                                        year: "numeric"
                                    }
                                )
                                : "";


                        return `

                            <article
    class="product-card"
    onclick="openProduct('${product.id}')"
    style="cursor:pointer;"
>

                                ${image}


                                <div class="product-content">

                                    <span class="product-category">

                                        ${escapeHtml(
                                            product.category ||
                                            "Other"
                                        )}

                                    </span>


                                    <h2 class="product-title">

                                        ${escapeHtml(
                                            product.title
                                        )}

                                    </h2>


                                    <p class="product-description">

                                        ${escapeHtml(
                                            product.description ||
                                            "No description provided."
                                        )}

                                    </p>


                                    <div class="product-price">

                                        ₹${price}

                                    </div>


                                    <div class="seller">

                                        👤 Verified HIT Student

                                        <span class="verified">
                                            ✓ Verified
                                        </span>


                                        ${
                                            date
                                                ? `
                                                <div class="date">
                                                    Posted ${date}
                                                </div>
                                                `
                                                : ""
                                        }

                                    </div>

                                </div>

                            </article>

                        `;

                    }
                ).join("");

        }


        /* =========================
           OPEN PRODUCT DETAILS
        ========================= */

        function openProduct(productId) {
            window.location.href =
                "product.html?id=" +
                encodeURIComponent(productId);
        }


        /* =========================
           SEARCH + FILTER
        ========================= */

        function filterProducts() {

            const search =
                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    .toLowerCase()
                    .trim();


            const category =
                document
                    .getElementById(
                        "categoryFilter"
                    )
                    .value;


            const sort =
                document
                    .getElementById(
                        "sortFilter"
                    )
                    .value;


            let filtered =
                allProducts.filter(
                    product => {

                        const title =
                            (
                                product.title ||
                                ""
                            ).toLowerCase();


                        const description =
                            (
                                product.description ||
                                ""
                            ).toLowerCase();


                        const productCategory =
                            product.category ||
                            "";


                        const matchesSearch =
                            !search ||
                            title.includes(search) ||
                            description.includes(search);


                        const matchesCategory =
                            !category ||
                            productCategory === category;


                        return (
                            matchesSearch &&
                            matchesCategory
                        );

                    }
                );


            if (sort === "low") {

                filtered.sort(
                    (a, b) =>
                        Number(a.price) -
                        Number(b.price)
                );

            }


            if (sort === "high") {

                filtered.sort(
                    (a, b) =>
                        Number(b.price) -
                        Number(a.price)
                );

            }


            if (sort === "newest") {

                filtered.sort(
                    (a, b) =>
                        new Date(b.created_at) -
                        new Date(a.created_at)
                );

            }


            displayProducts(
                filtered
            );

        }


        /* =========================
           LOGOUT
        ========================= */

        async function logout() {

            const {
                error
            } =
                await supabaseClient.auth.signOut();


            if (error) {

                alert(
                    "Logout failed. Please try again."
                );

                console.error(error);

                return;
            }


            window.location.replace(
                "login.html"
            );

        }


        /* =========================
           SECURITY / HTML ESCAPE
        ========================= */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================
           START
        ========================= */

        loadProducts();

    </script>

</body>

</html>
