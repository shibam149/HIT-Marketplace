<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marketplace | HIT Marketplace</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        /* TOP BAR */

        .topbar {
            background: #0b376f;
            color: white;
            text-align: center;
            padding: 9px;
            font-size: 13px;
        }

        /* NAVBAR */

        nav {
            min-height: 70px;
            background: white;
            border-bottom: 1px solid #e5eaf1;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 10px 6%;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            text-decoration: none;
            color: #172033;
            flex-shrink: 0;
        }

        .brand-logo {
            width: 42px;
            height: 42px;

            background: #0b376f;
            color: white;

            border-radius: 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        button,
        .nav-btn {
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .chat-btn {
            background: #edf4ff;
            color: #0b376f;
            padding: 11px 16px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid #dbe8fb;
        }

        .chat-btn:hover {
            background: #e2edff;
        }

        .chat-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 19px;
            height: 19px;

            padding: 0 5px;
            margin-left: 5px;

            border-radius: 999px;

            background: #dc2626;
            color: white;

            font-size: 10px;
            font-weight: 800;

            vertical-align: middle;
        }

        .sell-btn {
            background: #0b376f;
            color: white;

            padding: 11px 18px;
            border-radius: 8px;

            font-weight: 700;
            text-decoration: none;
        }

        .logout-btn {
            background: #f1f3f7;
            color: #172033;

            padding: 11px 16px;
            border-radius: 8px;
        }

        /* PAGE */

        .container {
            width: 88%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            color: #0b376f;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #64748b;
        }

        /* SEARCH */

        .search-box {
            background: white;
            border: 1px solid #e5eaf1;
            border-radius: 12px;

            padding: 18px;

            display: grid;
            grid-template-columns: 1fr 180px 150px;
            gap: 12px;

            margin-bottom: 30px;
        }

        .search-box input,
        .search-box select {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d7dfea;
            border-radius: 8px;

            font-size: 14px;
            outline: none;
        }

        .search-box input:focus,
        .search-box select:focus {
            border-color: #0b376f;
        }

        /* PRODUCTS */

        #productsGrid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: white;
            position: relative;

            border: 1px solid #e5eaf1;
            border-radius: 14px;

            overflow: hidden;

            transition: 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .product-image {
            width: 100%;
            height: 210px;

            object-fit: cover;
            background: #eef2f7;
        }

        .no-image {
            width: 100%;
            height: 210px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eef2f7;
            color: #64748b;
            font-size: 14px;
        }

        .product-content {
            padding: 18px;
        }

        .save-btn {
            position: absolute;

            top: 12px;
            right: 12px;

            width: 40px;
            height: 40px;

            border-radius: 50%;

            border: 1px solid #e5eaf1;
            background: white;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);

            font-size: 21px;
            cursor: pointer;

            z-index: 5;
        }

        .save-btn.saved {
            color: #dc2626;
        }

        .product-category {
            display: inline-block;

            background: #edf4ff;
            color: #0b376f;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 11px;
            font-weight: 700;

            margin-bottom: 10px;
        }

        .product-title {
            font-size: 19px;
            font-weight: 700;

            margin-bottom: 8px;

            color: #172033;
        }

        .product-description {
            color: #64748b;
            font-size: 13px;

            line-height: 1.5;

            min-height: 40px;

            margin-bottom: 14px;
        }

        .product-price {
            font-size: 22px;
            font-weight: 800;

            color: #0b376f;

            margin-bottom: 12px;
        }

        .seller {
            border-top: 1px solid #edf0f4;

            padding-top: 12px;

            font-size: 12px;
            color: #64748b;
        }

        .verified {
            color: #15803d;
            font-weight: 700;
        }

        .date {
            margin-top: 5px;
            color: #94a3b8;
        }

        /* STATUS */

        .message {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .message h2 {
            color: #172033;
            margin-bottom: 8px;
        }

        .error {
            color: #b91c1c;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {
            nav {
                align-items: flex-start;
                flex-direction: column;
            }

            .nav-right {
                width: 100%;
                justify-content: flex-start;
            }

            .search-box {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 750px) {

            nav {
                padding: 12px 4%;
            }

            .brand-name {
                font-size: 16px;
            }

            .search-box {
                grid-template-columns: 1fr;
            }

            .container {
                width: 92%;
            }

            .nav-right {
                gap: 6px;
            }

            .chat-btn,
            .sell-btn,
            .logout-btn {
                padding: 9px 11px;
                font-size: 12px;
            }

            .heading h1 {
                font-size: 27px;
            }
        }

        @media (max-width: 480px) {

            .brand-logo {
                width: 36px;
                height: 36px;
                font-size: 12px;
            }

            .brand-name {
                font-size: 14px;
            }

            .nav-right {
                display: grid;
                grid-template-columns: 1fr 1fr;
                width: 100%;
            }

            .nav-right a,
            .nav-right button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>


<body>

    <!-- TOP BAR -->

    <div class="topbar">
        🎓 HIT Student Marketplace • Buy. Sell. Connect.
    </div>


    <!-- NAVBAR -->

    <nav>

        <a href="index.html" class="brand">

            <div class="brand-logo">
                HIT
            </div>

            <div class="brand-name">
                HIT Marketplace
            </div>

        </a>


        <div class="nav-right">

            <a href="my-listings.html" class="chat-btn">
                📦 My Listings
            </a>


            <a href="chats.html" class="chat-btn">

                💬 Chats

                <span
                    id="chatBadge"
                    class="chat-badge"
                    style="display:none;">
                    0
                </span>

            </a>


            <a href="saved.html" class="chat-btn">
                ❤️ Saved
            </a>


            <!-- NOTIFICATIONS -->

            <a
                href="notifications.html"
                class="chat-btn"
                id="notificationNavButton">

                🔔 Notifications

                <span
                    id="notificationBadge"
                    class="chat-badge"
                    style="display:none;">
                    0
                </span>

            </a>


            <a href="sell.html" class="sell-btn">
                + Sell Item
            </a>


            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <!-- MAIN -->

    <main class="container">

        <div class="heading">

            <h1>
                Marketplace
            </h1>

            <p>
                Buy and sell items with verified HIT students.
            </p>

        </div>


        <!-- SEARCH / FILTER -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search items..."
                oninput="filterProducts()">


            <select
                id="categoryFilter"
                onchange="filterProducts()">

                <option value="">
                    All Categories
                </option>

                <option value="Books">
                    Books
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Furniture">
                    Furniture
                </option>

                <option value="Clothing">
                    Clothing
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <select
                id="sortFilter"
                onchange="filterProducts()">

                <option value="newest">
                    Newest
                </option>

                <option value="oldest">
                    Oldest
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

            </select>

        </div>


        <!-- PRODUCT GRID -->

        <div id="productsGrid">

            <div class="message">

                <h2>
                    Loading products...
                </h2>

                <p>
                    Please wait.
                </p>

            </div>

        </div>

    </main>


    <script>

        /* ================================
           SUPABASE CONFIGURATION
        ================================= */

        const SUPABASE_URL =
            "https://ziyyqhnmhbwomibpsenf.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_i25Oy3Rbnzr3S45H4KzQyg_dLeEd3YH";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* ================================
           GLOBAL VARIABLES
        ================================= */

        let currentUser = null;

        let allProducts = [];

        let savedListingIds = new Set();


        /* ================================
           AUTH CHECK
        ================================= */

        async function checkUser() {

            const {
                data: {
                    user
                },
                error
            } = await supabaseClient.auth.getUser();


            if (error || !user) {

                window.location.href =
                    "login.html";

                return null;
            }


            currentUser = user;

            return user;
        }


        /* ================================
           LOAD NOTIFICATION COUNT
        ================================= */

        async function loadNotificationCount(userId) {

            const {
                count,
                error
            } = await supabaseClient
                .from("notifications")
                .select(
                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                )
                .eq("user_id", userId)
                .eq("is_read", false);


            if (error) {

                console.error(
                    "Notification count error:",
                    error
                );

                return;
            }


            const badge =
                document.getElementById(
                    "notificationBadge"
                );


            if (!badge) return;


            if (count && count > 0) {

                badge.textContent =
                    count > 99 ? "99+" : count;

                badge.style.display =
                    "inline-flex";

            } else {

                badge.style.display =
                    "none";
            }
        }


        /* ================================
           NOTIFICATION REALTIME
        ================================= */

        function startNotificationRealtime() {

            if (!currentUser) return;


            supabaseClient
                .channel(
                    "notification-badge-" +
                    currentUser.id
                )
                .on(
                    "postgres_changes",
                    {
                        event: "*",
                        schema: "public",
                        table: "notifications",
                        filter:
                            "user_id=eq." +
                            currentUser.id
                    },
                    function () {

                        loadNotificationCount(
                            currentUser.id
                        );

                    }
                )
                .subscribe();
        }


        /* ================================
           LOAD CHAT UNREAD COUNT
        ================================= */

        async function loadChatUnreadCount(
            userId
        ) {

            const {
                count,
                error
            } = await supabaseClient
                .from("chats")
                .select(
                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                )
                .or(
                    "buyer_id.eq." +
                    userId +
                    ",seller_id.eq." +
                    userId
                )
                .eq(
                    "is_read",
                    false
                )
                .neq(
                    "sender_id",
                    userId
                );


            if (error) {

                console.error(
                    "Chat unread error:",
                    error
                );

                return;
            }


            const badge =
                document.getElementById(
                    "chatBadge"
                );


            if (!badge) return;


            if (count && count > 0) {

                badge.textContent =
                    count > 99 ? "99+" : count;

                badge.style.display =
                    "inline-flex";

            } else {

                badge.style.display =
                    "none";
            }
        }


        /* ================================
           CHAT REALTIME
        ================================= */

        function startChatRealtime() {

            if (!currentUser) return;


            supabaseClient
                .channel(
                    "chat-badge-" +
                    currentUser.id
                )
                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "chats"
                    },
                    function (payload) {

                        const message =
                            payload.new;


                        if (
                            message.sender_id !==
                            currentUser.id
                        ) {

                            loadChatUnreadCount(
                                currentUser.id
                            );
                        }

                    }
                )
                .subscribe();
        }


        /* ================================
           LOAD SAVED ITEMS
        ================================= */

        async function loadSavedItems(
            userId
        ) {

            const {
                data,
                error
            } = await supabaseClient
                .from("saved_items")
                .select("listing_id")
                .eq(
                    "user_id",
                    userId
                );


            if (error) {

                console.error(
                    "Saved items error:",
                    error
                );

                return;
            }


            savedListingIds =
                new Set(
                    (data || [])
                        .map(
                            item =>
                                item.listing_id
                        )
                );
        }


        /* ================================
           SAVE / UNSAVE ITEM
        ================================= */

        async function toggleSave(
            event,
            listingId
        ) {

            event.preventDefault();
            event.stopPropagation();


            if (!currentUser) {

                alert(
                    "Please login first."
                );

                return;
            }


            const button =
                event.currentTarget;


            const isSaved =
                savedListingIds.has(
                    listingId
                );


            if (isSaved) {

                const {
                    error
                } = await supabaseClient
                    .from("saved_items")
                    .delete()
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .eq(
                        "listing_id",
                        listingId
                    );


                if (error) {

                    alert(
                        "Could not remove saved item."
                    );

                    console.error(error);

                    return;
                }


                savedListingIds.delete(
                    listingId
                );


                button.textContent = "♡";

                button.classList.remove(
                    "saved"
                );

            } else {

                const {
                    error
                } = await supabaseClient
                    .from("saved_items")
                    .insert({

                        user_id:
                            currentUser.id,

                        listing_id:
                            listingId

                    });


                if (error) {

                    alert(
                        "Could not save item."
                    );

                    console.error(error);

                    return;
                }


                savedListingIds.add(
                    listingId
                );


                button.textContent = "♥";

                button.classList.add(
                    "saved"
                );
            }
        }


        /* ================================
           LOAD PRODUCTS
        ================================= */

        async function loadProducts() {

            const grid =
                document.getElementById(
                    "productsGrid"
                );


            grid.innerHTML = `
                <div class="message">
                    <h2>Loading products...</h2>
                    <p>Please wait.</p>
                </div>
            `;


            const {
                data,
                error
            } = await supabaseClient
                .from("listings")
                .select(`
                    id,
                    seller_id,
                    title,
                    description,
                    category,
                    price,
                    image_url,
                    status,
                    created_at
                `)
                .eq(
                    "status",
                    "ACTIVE"
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Products error:",
                    error
                );


                grid.innerHTML = `
                    <div class="message error">
                        <h2>Could not load products</h2>
                        <p>
                            ${escapeHtml(
                                error.message
                            )}
                        </p>
                    </div>
                `;

                return;
            }


            allProducts =
                data || [];


            if (
                allProducts.length === 0
            ) {

                grid.innerHTML = `
                    <div class="message">
                        <h2>No products available</h2>
                        <p>
                            Be the first HIT student
                            to sell something.
                        </p>
                    </div>
                `;

                return;
            }


            await loadSellerProfiles();

            renderProducts(
                allProducts
            );
        }


        /* ================================
           SELLER PROFILES
        ================================= */

        let sellerProfiles = {};


        async function loadSellerProfiles() {

            const sellerIds =
                [
                    ...new Set(
                        allProducts.map(
                            item =>
                                item.seller_id
                        )
                    )
                ];


            if (
                sellerIds.length === 0
            ) return;


            const {
                data,
                error
            } = await supabaseClient
                .from("profiles")
                .select(`
                    id,
                    full_name,
                    department,
                    year,
                    verification_status
                `)
                .in(
                    "id",
                    sellerIds
                );


            if (error) {

                console.error(
                    "Profile error:",
                    error
                );

                return;
            }


            sellerProfiles = {};


            (data || []).forEach(
                profile => {

                    sellerProfiles[
                        profile.id
                    ] = profile;

                }
            );
        }


        /* ================================
           RENDER PRODUCTS
        ================================= */

        function renderProducts(
            products
        ) {

            const grid =
                document.getElementById(
                    "productsGrid"
                );


            if (
                !products ||
                products.length === 0
            ) {

                grid.innerHTML = `
                    <div class="message">
                        <h2>No matching products</h2>
                        <p>
                            Try another search
                            or category.
                        </p>
                    </div>
                `;

                return;
            }


            grid.innerHTML =
                products
                    .map(
                        product =>
                            createProductCard(
                                product
                            )
                    )
                    .join("");
        }


        /* ================================
           PRODUCT CARD
        ================================= */

        function createProductCard(
            product
        ) {

            const seller =
                sellerProfiles[
                    product.seller_id
                ] || {};


            const isSaved =
                savedListingIds.has(
                    product.id
                );


            const image =
                product.image_url
                    ? `
                        <img
                            class="product-image"
                            src="${escapeHtml(
                                product.image_url
                            )}"
                            alt="${escapeHtml(
                                product.title
                            )}"
                            loading="lazy"
                        >
                    `
                    : `
                        <div class="no-image">
                            📦 No Image
                        </div>
                    `;


            const sellerName =
                seller.full_name ||
                "HIT Student";


            const verified =
                seller.verification_status ===
                "VERIFIED";


            const date =
                product.created_at
                    ? new Date(
                        product.created_at
                    ).toLocaleDateString(
                        "en-IN"
                    )
                    : "";


            return `

                <div
                    class="product-card"
                    onclick="openProduct(
                        '${product.id}'
                    )"
                >

                    ${image}


                    <button
                        class="save-btn ${
                            isSaved
                                ? "saved"
                                : ""
                        }"
                        onclick="
                            toggleSave(
                                event,
                                '${product.id}'
                            )
                        "
                    >
                        ${
                            isSaved
                                ? "♥"
                                : "♡"
                        }
                    </button>


                    <div class="product-content">

                        ${
                            product.category
                                ? `
                                    <span
                                        class="product-category"
                                    >
                                        ${escapeHtml(
                                            product.category
                                        )}
                                    </span>
                                `
                                : ""
                        }


                        <div
                            class="product-title"
                        >
                            ${escapeHtml(
                                product.title
                            )}
                        </div>


                        <div
                            class="product-description"
                        >
                            ${escapeHtml(
                                product.description ||
                                "No description available."
                            )}
                        </div>


                        <div
                            class="product-price"
                        >
                            ₹${Number(
                                product.price || 0
                            ).toLocaleString(
                                "en-IN"
                            )}
                        </div>


                        <div class="seller">

                            Seller:
                            <strong>
                                ${escapeHtml(
                                    sellerName
                                )}
                            </strong>


                            ${
                                verified
                                    ? `
                                        <span
                                            class="verified"
                                        >
                                            ✓ Verified
                                        </span>
                                    `
                                    : ""
                            }


                            ${
                                seller.department
                                    ? `
                                        <div>
                                            ${escapeHtml(
                                                seller.department
                                            )}
                                            ${
                                                seller.year
                                                    ? " • " +
                                                      escapeHtml(
                                                          seller.year
                                                      )
                                                    : ""
                                            }
                                        </div>
                                    `
                                    : ""
                            }


                            ${
                                date
                                    ? `
                                        <div
                                            class="date"
                                        >
                                            Posted:
                                            ${date}
                                        </div>
                                    `
                                    : ""
                            }

                        </div>

                    </div>

                </div>
            `;
        }


        /* ================================
           OPEN PRODUCT
        ================================= */

        function openProduct(
            listingId
        ) {

            window.location.href =
                "product.html?id=" +
                encodeURIComponent(
                    listingId
                );
        }


        /* ================================
           SEARCH / FILTER
        ================================= */

        function filterProducts() {

            const search =
                (
                    document.getElementById(
                        "searchInput"
                    ).value || ""
                )
                    .toLowerCase()
                    .trim();


            const category =
                document.getElementById(
                    "categoryFilter"
                ).value;


            const sort =
                document.getElementById(
                    "sortFilter"
                ).value;


            let filtered =
                allProducts.filter(
                    product => {

                        const title =
                            (
                                product.title ||
                                ""
                            ).toLowerCase();


                        const description =
                            (
                                product.description ||
                                ""
                            ).toLowerCase();


                        const productCategory =
                            product.category ||
                            "";


                        const matchesSearch =
                            !search ||
                            title.includes(
                                search
                            ) ||
                            description.includes(
                                search
                            ) ||
                            productCategory
                                .toLowerCase()
                                .includes(
                                    search
                                );


                        const matchesCategory =
                            !category ||
                            productCategory ===
                                category;


                        return (
                            matchesSearch &&
                            matchesCategory
                        );
                    }
                );


            filtered.sort(
                (a, b) => {

                    if (
                        sort === "oldest"
                    ) {

                        return new Date(
                            a.created_at
                        ) -
                        new Date(
                            b.created_at
                        );
                    }


                    if (
                        sort === "low"
                    ) {

                        return Number(
                            a.price || 0
                        ) -
                        Number(
                            b.price || 0
                        );
                    }


                    if (
                        sort === "high"
                    ) {

                        return Number(
                            b.price || 0
                        ) -
                        Number(
                            a.price || 0
                        );
                    }


                    return new Date(
                        b.created_at
                    ) -
                    new Date(
                        a.created_at
                    );
                }
            );


            renderProducts(
                filtered
            );
        }


        /* ================================
           LOGOUT
        ================================= */

        async function logout() {

            const {
                error
            } = await supabaseClient
                .auth
                .signOut();


            if (error) {

                alert(
                    "Logout failed: " +
                    error.message
                );

                return;
            }


            window.location.href =
                "login.html";
        }


        /* ================================
           ESCAPE HTML
        ================================= */

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /* ================================
           PAGE START
        ================================= */

        async function startPage() {

            const user =
                await checkUser();


            if (!user) return;


            await loadSavedItems(
                user.id
            );


            await loadProducts();


            await loadChatUnreadCount(
                user.id
            );


            await loadNotificationCount(
                user.id
            );


            startChatRealtime();

            startNotificationRealtime();
        }


        startPage();

    </script>
