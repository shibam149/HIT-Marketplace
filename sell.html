<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell an Item - HIT Marketplace</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #123b6d;
      color: white;
      padding: 18px 30px;
    }

    header h1 {
      font-size: 24px;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .form-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #123b6d;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      margin-top: 18px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #123b6d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:disabled {
      background: #888;
      cursor: not-allowed;
    }

    .back-btn {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      color: #123b6d;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }

    .note {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>HIT Marketplace</h1>
</header>

<div class="container">

  <div class="form-card">

    <h2>Sell an Item</h2>

    <form id="sellForm">

      <label for="title">Item Name *</label>
      <input
        type="text"
        id="title"
        placeholder="Example: Engineering Calculator"
        required
      >

      <label for="category">Category *</label>
      <select id="category" required>
        <option value="">Select category</option>
        <option value="Books">Books</option>
        <option value="Electronics">Electronics</option>
        <option value="Calculator">Calculator</option>
        <option value="Notes">Notes</option>
        <option value="Stationery">Stationery</option>
        <option value="Cycle">Cycle</option>
        <option value="Furniture">Furniture</option>
        <option value="Other">Other</option>
      </select>

      <label for="price">Price (₹) *</label>
      <input
        type="number"
        id="price"
        min="1"
        step="0.01"
        placeholder="Example: 500"
        required
      >

      <label for="condition">Condition *</label>
      <select id="condition" required>
        <option value="">Select condition</option>
        <option value="New">New</option>
        <option value="Like New">Like New</option>
        <option value="Good">Good</option>
        <option value="Fair">Fair</option>
      </select>

      <label for="description">Description</label>
      <textarea
        id="description"
        placeholder="Describe your item..."
      ></textarea>

      <label for="pickup">Pickup Location *</label>
      <input
        type="text"
        id="pickup"
        placeholder="Example: HIT Main Gate"
        required
      >

      <label for="photo">Product Photo *</label>
      <input
        type="file"
        id="photo"
        accept="image/jpeg,image/png"
        required
      >

      <p class="note">
        Maximum photo size: 5 MB. Please use a clear photo of the item.
      </p>

      <button
        type="submit"
        class="submit-btn"
        id="submitBtn"
      >
        Post Item
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back-btn">
      ← Back to Marketplace
    </a>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://ziyyqhnmhbwomibpsenf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_i25Oy3Rbnzr3S45H4KzQyg_dLeEd3YH";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const form =
  document.getElementById("sellForm");

const submitBtn =
  document.getElementById("submitBtn");

const message =
  document.getElementById("message");


function showMessage(text, success = false) {

  message.style.display = "block";
  message.textContent = text;

  message.style.background =
    success ? "#d1e7dd" : "#f8d7da";

  message.style.color =
    success ? "#0f5132" : "#842029";
}


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  submitBtn.disabled = true;
  submitBtn.textContent = "Posting...";

  message.style.display = "none";


  try {

    // Check logged-in user
    const {
      data: { user },
      error: userError
    } = await client.auth.getUser();


    if (userError || !user) {

      throw new Error(
        "Please login before selling an item."
      );

    }


    // Check verification status
    const {
      data: profile,
      error: profileError
    } = await client
      .from("profiles")
      .select("verification_status")
      .eq("id", user.id)
      .single();


    if (profileError) {
      throw profileError;
    }


    if (profile.verification_status !== "VERIFIED") {

      throw new Error(
        "Only verified students can sell items."
      );

    }


    const title =
      document.getElementById("title").value.trim();

    const category =
      document.getElementById("category").value;

    const price =
      Number(document.getElementById("price").value);

    const condition =
      document.getElementById("condition").value;

    const description =
      document.getElementById("description").value.trim();

    const pickup =
      document.getElementById("pickup").value.trim();

    const photo =
      document.getElementById("photo").files[0];


    if (!photo) {

      throw new Error(
        "Please select a product photo."
      );

    }


    if (photo.size > 5 * 1024 * 1024) {

      throw new Error(
        "Photo must be smaller than 5 MB."
      );

    }


    // Create unique file name
    const extension =
      photo.name.split(".").pop().toLowerCase();

    const fileName =
      `${Date.now()}_${crypto.randomUUID()}.${extension}`;

    const filePath =
      `${user.id}/${fileName}`;


    // Upload product image
    const {
      error: uploadError
    } = await client.storage
      .from("product-images")
      .upload(filePath, photo, {
        contentType: photo.type,
        upsert: false
      });


    if (uploadError) {
      throw uploadError;
    }


    // Create product record
    const {
      data: product,
      error: productError
    } = await client
      .from("products")
      .insert({
        seller_id: user.id,
        title: title,
        category: category,
        price: price,
        condition: condition,
        description: description,
        pickup_location: pickup,
        status: "AVAILABLE"
      })
      .select()
      .single();


    if (productError) {

      // Remove uploaded image if database insert fails
      await client.storage
        .from("product-images")
        .remove([filePath]);

      throw productError;
    }


    showMessage(
      "Item posted successfully! Your item is now available in the marketplace.",
      true
    );


    form.reset();


  } catch (error) {

    console.error(error);

    showMessage(
      "Error: " + error.message
    );

  }


  submitBtn.disabled = false;
  submitBtn.textContent = "Post Item";

});

</script>

</body>
</html>
