<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell an Item | HIT Marketplace</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  background: #f7f9fc;
  color: #172033;
}

.topbar {
  background: #071d3b;
  color: #dbe7f5;
  text-align: center;
  padding: 9px;
  font-size: 13px;
}

nav {
  height: 78px;
  background: rgba(255,255,255,0.97);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 7%;
  position: sticky;
  top: 0;
  z-index: 1000;
  border-bottom: 1px solid #e5eaf1;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}

.brand-logo {
  width: 46px;
  height: 46px;
  background: #0b376f;
  color: white;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 17px;
}

.brand-name {
  color: #0b376f;
  font-size: 21px;
  font-weight: 800;
}

.back-link {
  color: #0b376f;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
}

.page-wrap {
  max-width: 720px;
  margin: 50px auto 90px;
  padding: 0 20px;
}

.page-heading h1 {
  color: #0b376f;
  font-size: 30px;
  margin-bottom: 8px;
}

.page-heading p {
  color: #64748b;
  font-size: 14px;
  margin-bottom: 32px;
}

form {
  background: white;
  border: 1px solid #e5eaf1;
  border-radius: 14px;
  padding: 35px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: #172033;
  margin-bottom: 7px;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #d7dfea;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  color: #172033;
  font-family: inherit;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: #0b376f;
}

.field textarea {
  resize: vertical;
  min-height: 100px;
}

.row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.image-drop {
  border: 2px dashed #cbd8e8;
  border-radius: 10px;
  padding: 24px;
  text-align: center;
  cursor: pointer;
  color: #64748b;
  font-size: 13px;
  position: relative;
  overflow: hidden;
}

.image-drop.has-image {
  border-style: solid;
  padding: 0;
}

#previewImg {
  display: none;
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  border-radius: 8px;
}

.submit-btn {
  background: #0b376f;
  color: white;
  border: none;
  padding: 15px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  margin-top: 6px;
}

.submit-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.status-msg {
  font-size: 13px;
  padding: 12px 14px;
  border-radius: 8px;
  display: none;
}

.status-msg.error {
  display: block;
  background: #fef2f2;
  color: #b91c1c;
  border: 1px solid #fecaca;
}

.status-msg.success {
  display: block;
  background: #f0fdf4;
  color: #15803d;
  border: 1px solid #bbf7d0;
}

@media(max-width:650px) {
  .row-2 {
    grid-template-columns: 1fr;
  }

  form {
    padding: 22px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  🎓 HIT Student Marketplace • Buy. Sell. Connect.
</div>

<nav>
  <a class="brand" href="index.html">
    <div class="brand-logo">HIT</div>
    <div class="brand-name">HIT Marketplace</div>
  </a>

  <a class="back-link" href="index.html">
    ← Back to Home
  </a>
</nav>

<div class="page-wrap">

  <div class="page-heading">
    <h1>Sell an Item</h1>
    <p>
      Fill in the details below — your listing will be visible to other
      verified HIT students.
    </p>
  </div>

  <form id="listingForm">

    <div class="field">
      <label for="title">Item Title</label>

      <input
        type="text"
        id="title"
        placeholder="e.g. Engineering Mathematics Textbook"
        required
      >
    </div>

    <div class="row-2">

      <div class="field">
        <label for="category">Category</label>

        <select id="category" required>
          <option value="" disabled selected>
            Select a category
          </option>

          <option value="Books">Books</option>
          <option value="Electronics">Electronics</option>
          <option value="Cycles">Cycles</option>
          <option value="Furniture">Furniture</option>
          <option value="Accessories">Accessories</option>
          <option value="Clothing">Clothing</option>
          <option value="Notes">Notes</option>
          <option value="Hostel Items">Hostel Items</option>
        </select>
      </div>

      <div class="field">
        <label for="price">Price (₹)</label>

        <input
          type="number"
          id="price"
          min="0"
          step="1"
          placeholder="e.g. 350"
          required
        >
      </div>

    </div>

    <div class="field">
      <label for="description">Description</label>

      <textarea
        id="description"
        placeholder="Condition, why you're selling, any details a buyer should know..."
        required
      ></textarea>
    </div>

    <div class="field">

      <label>Photo</label>

      <div
        class="image-drop"
        id="imageDrop"
        onclick="document.getElementById('imageInput').click()"
      >

        <span id="dropText">
          Click to upload a photo of the item
        </span>

        <img
          id="previewImg"
          alt="Product Preview"
        >

      </div>

      <input
        type="file"
        id="imageInput"
        accept="image/jpeg,image/png,image/webp"
        style="display:none"
        required
      >

    </div>

    <div id="statusMsg" class="status-msg"></div>

    <button
      type="submit"
      class="submit-btn"
      id="submitBtn"
    >
      Publish Listing
    </button>

  </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ziyyqhnmhbwomibpsenf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_i25Oy3Rbnzr3S45H4KzQyg_dLeEd3YH";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ============================================
// IMPORTANT: YOUR EXISTING STORAGE BUCKET
// ============================================

const IMAGE_BUCKET = "product-images";


let currentSession = null;


// ============================================
// AUTH + VERIFICATION CHECK
// ============================================

async function checkUser() {

  let session = null;
  let error = null;

  // Give Supabase time to restore login session
  for (let attempt = 0; attempt < 10; attempt++) {

    const result =
      await supabaseClient.auth.getSession();

    session = result.data.session;
    error = result.error;

    if (error || session) {
      break;
    }

    await new Promise(resolve =>
      setTimeout(resolve, 150)
    );
  }

  // Not logged in
  if (error || !session) {

    window.location.replace("login.html");

    return false;
  }


  // Check student verification
  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("profiles")
    .select("verification_status")
    .eq("id", session.user.id)
    .maybeSingle();


  if (
    profileError ||
    !profile ||
    profile.verification_status !== "VERIFIED"
  ) {

    window.location.replace("index.html");

    return false;
  }


  currentSession = session;

  return true;
}


// Run authentication check
checkUser();


// ============================================
// IMAGE PREVIEW
// ============================================

const imageInput =
  document.getElementById("imageInput");

const previewImg =
  document.getElementById("previewImg");

const dropText =
  document.getElementById("dropText");

const imageDrop =
  document.getElementById("imageDrop");


imageInput.addEventListener(
  "change",
  function () {

    const file = imageInput.files[0];

    if (!file) {
      return;
    }


    // Maximum image size: 5 MB
    if (file.size > 5 * 1024 * 1024) {

      alert("Image size must be less than 5 MB.");

      imageInput.value = "";

      return;
    }


    // Check image type
    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {

      alert(
        "Please select a JPG, PNG or WEBP image."
      );

      imageInput.value = "";

      return;
    }


    // Show preview
    previewImg.src =
      URL.createObjectURL(file);

    previewImg.style.display = "block";

    dropText.style.display = "none";

    imageDrop.classList.add("has-image");
  }
);


// ============================================
// STATUS MESSAGE
// ============================================

const statusMsg =
  document.getElementById("statusMsg");


function showStatus(type, message) {

  statusMsg.className =
    "status-msg " + type;

  statusMsg.textContent =
    message;

  statusMsg.style.display =
    "block";
}


// ============================================
// FORM SUBMIT
// ============================================

const form =
  document.getElementById("listingForm");

const submitBtn =
  document.getElementById("submitBtn");


form.addEventListener(
  "submit",
  async function (e) {

    e.preventDefault();


    // ----------------------------------------
    // Get current session again
    // ----------------------------------------

    const {
      data: { session },
      error: sessionError
    } = await supabaseClient.auth.getSession();


    if (sessionError || !session) {

      showStatus(
        "error",
        "Your login session has expired. Please login again."
      );

      return;
    }


    currentSession = session;


    // ----------------------------------------
    // Get form values
    // ----------------------------------------

    const title =
      document.getElementById("title")
        .value
        .trim();

    const category =
      document.getElementById("category")
        .value;

    const price =
      parseFloat(
        document.getElementById("price").value
      );

    const description =
      document.getElementById("description")
        .value
        .trim();

    const file =
      imageInput.files[0];


    // ----------------------------------------
    // Validation
    // ----------------------------------------

    if (!title) {

      showStatus(
        "error",
        "Please enter the item title."
      );

      return;
    }


    if (!category) {

      showStatus(
        "error",
        "Please select a category."
      );

      return;
    }


    if (isNaN(price) || price < 0) {

      showStatus(
        "error",
        "Please enter a valid price."
      );

      return;
    }


    if (!description) {

      showStatus(
        "error",
        "Please enter a description."
      );

      return;
    }


    if (!file) {

      showStatus(
        "error",
        "Please add a photo of the item."
      );

      return;
    }


    // ----------------------------------------
    // Disable button
    // ----------------------------------------

    submitBtn.disabled = true;

    submitBtn.textContent =
      "Publishing...";

    statusMsg.style.display =
      "none";


    let uploadedFilePath = null;


    try {

      // ======================================
      // 1. UPLOAD PRODUCT IMAGE
      // ======================================

      const fileExtension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const filePath =
        `${currentSession.user.id}/${Date.now()}.${fileExtension}`;


      uploadedFilePath =
        filePath;


      const {
        error: uploadError
      } = await supabaseClient
        .storage
        .from(IMAGE_BUCKET)
        .upload(
          filePath,
          file,
          {
            upsert: false,
            contentType: file.type
          }
        );


      if (uploadError) {

        throw new Error(
          "Image upload failed: " +
          uploadError.message
        );
      }


      // ======================================
      // 2. GET PUBLIC IMAGE URL
      // ======================================

      const {
        data: publicUrlData
      } = supabaseClient
        .storage
        .from(IMAGE_BUCKET)
        .getPublicUrl(filePath);


      const imageUrl =
        publicUrlData.publicUrl;


      // ======================================
      // 3. INSERT LISTING INTO DATABASE
      // ======================================

      const {
        error: insertError
      } = await supabaseClient
        .from("listings")
        .insert({

          seller_id:
            currentSession.user.id,

          title:
            title,

          description:
            description,

          category:
            category,

          price:
            price,

          image_url:
            imageUrl,

          status:
            "ACTIVE"

        });


      if (insertError) {

        throw new Error(
          "Listing creation failed: " +
          insertError.message
        );
      }


      // ======================================
      // SUCCESS
      // ======================================

      showStatus(
        "success",
        "Your listing has been published successfully!"
      );


      // Reset form
      form.reset();

      previewImg.style.display =
        "none";

      dropText.style.display =
        "block";

      imageDrop.classList.remove(
        "has-image"
      );


      // Go to marketplace
      setTimeout(
        function () {

          window.location.href =
            "marketplace.html";

        },
        1200
      );


    } catch (err) {

      console.error(
        "Publish listing error:",
        err
      );


      // --------------------------------------
      // Delete uploaded image if DB insert
      // failed
      // --------------------------------------

      if (uploadedFilePath) {

        await supabaseClient
          .storage
          .from(IMAGE_BUCKET)
          .remove([
            uploadedFilePath
          ]);
      }


      showStatus(
        "error",
        err.message ||
        "Something went wrong. Please try again."
      );


    } finally {

      submitBtn.disabled = false;

      submitBtn.textContent =
        "Publish Listing";
    }

  }
);

</script>

</body>
</html>
