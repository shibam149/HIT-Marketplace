<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Listings | HIT Marketplace</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f6f8fc;
            color: #172033;
        }

        .topbar {
            background: linear-gradient(90deg, #0b376f, #1456a0);
            color: #fff;
            text-align: center;
            padding: 9px;
            font-size: 13px;
            letter-spacing: .2px;
        }

        nav {
            min-height: 72px;
            background: rgba(255,255,255,.96);
            border-bottom: 1px solid #e7ebf2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 2px 14px rgba(15,23,42,.05);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #172033;
        }

        .brand-logo {
            width: 43px;
            height: 43px;
            background: linear-gradient(135deg, #0b376f, #1e6acb);
            color: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            box-shadow: 0 5px 14px rgba(11,55,111,.20);
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .nav-btn,
        .logout-btn {
            border: 1px solid #dce5f0;
            background: #fff;
            color: #0b376f;
            padding: 10px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .nav-btn:hover,
        .logout-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(15,23,42,.08);
        }

        .container {
            width: 90%;
            max-width: 1240px;
            margin: 34px auto 60px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 22px;
        }

        .heading h1 {
            color: #102f5e;
            font-size: 34px;
            margin-bottom: 7px;
            letter-spacing: -.7px;
        }

        .heading p {
            color: #64748b;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #e5eaf2;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 5px 18px rgba(15,23,42,.045);
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: "";
            position: absolute;
            right: -20px;
            bottom: -25px;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #edf4ff;
        }

        .stat-label {
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .stat-value {
            font-size: 27px;
            font-weight: 850;
            color: #0b376f;
            position: relative;
            z-index: 1;
        }

        .filters {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: #fff;
            border: 1px solid #e5eaf2;
            border-radius: 14px;
            padding: 9px;
            width: fit-content;
            box-shadow: 0 4px 14px rgba(15,23,42,.035);
        }

        .filter-btn {
            border: 0;
            background: transparent;
            color: #64748b;
            padding: 9px 15px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 750;
            transition: .2s;
        }

        .filter-btn:hover {
            background: #f1f5fb;
            color: #0b376f;
        }

        .filter-btn.active {
            background: #0b376f;
            color: #fff;
            box-shadow: 0 4px 10px rgba(11,55,111,.18);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
            gap: 22px;
        }

        .card {
            background: #fff;
            border: 1px solid #e4e9f1;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 7px 24px rgba(15,23,42,.06);
            transition: transform .22s, box-shadow .22s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 32px rgba(15,23,42,.10);
        }

        .card img,
        .no-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: linear-gradient(135deg, #edf2f8, #f8fafc);
        }

        .no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-weight: 700;
        }

        .content {
            padding: 19px;
        }

        .category {
            display: inline-block;
            background: #edf4ff;
            color: #1553a0;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 11px;
        }

        .title {
            font-size: 20px;
            line-height: 1.2;
            margin-bottom: 7px;
            color: #172033;
        }

        .desc {
            color: #64748b;
            font-size: 13px;
            line-height: 1.55;
            min-height: 40px;
            margin-bottom: 13px;
        }

        .price {
            font-size: 24px;
            font-weight: 850;
            color: #0b376f;
            margin-bottom: 10px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 11px;
        }

        .status.ACTIVE {
            background: #dcfce7;
            color: #166534;
        }

        .status.RESERVED {
            background: #fef3c7;
            color: #92400e;
        }

        .status.SOLD {
            background: #e5e7eb;
            color: #374151;
        }

        .posted {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            border-top: 1px solid #edf1f6;
            padding-top: 15px;
        }

        button.action {
            border: 1px solid transparent;
            padding: 10px 9px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 750;
            font-size: 13px;
            min-height: 40px;
            transition: .18s;
        }

        button.action:hover {
            transform: translateY(-1px);
            filter: brightness(.98);
        }

        .view {
            background: #edf4ff;
            color: #0b376f;
            border-color: #d8e7ff !important;
        }

        .edit {
            background: #e0f2fe;
            color: #0369a1;
            border-color: #bae6fd !important;
        }

        .reserve {
            background: #fff7db;
            color: #92400e;
            border-color: #fde68a !important;
        }

        .sold {
            background: #e8f8ed;
            color: #166534;
            border-color: #bbf7d0 !important;
        }

        .delete {
            background: #fff0f0;
            color: #b91c1c;
            border-color: #fecaca !important;
        }

        .message {
            text-align: center;
            padding: 65px 20px;
            color: #64748b;
            background: #fff;
            border-radius: 18px;
            border: 1px solid #e5eaf1;
            box-shadow: 0 7px 24px rgba(15,23,42,.045);
            grid-column: 1 / -1;
        }

        .message h2 {
            color: #172033;
            margin-bottom: 8px;
        }

        .error {
            color: #b91c1c;
        }

        @media (max-width: 850px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .heading {
                align-items: flex-start;
                flex-direction: column;
            }

            nav {
                padding: 0 4%;
            }
        }

        @media (max-width: 600px) {
            .brand-name {
                font-size: 16px;
            }

            .nav-right {
                gap: 5px;
            }

            .nav-btn,
            .logout-btn {
                padding: 8px 9px;
                font-size: 12px;
            }

            .container {
                width: 92%;
                margin-top: 25px;
            }

            .heading h1 {
                font-size: 28px;
            }

            .stats {
                gap: 10px;
            }

            .stat-card {
                padding: 14px;
            }

            .filters {
                width: 100%;
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .filter-btn {
                white-space: nowrap;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>


<body>

    <!-- TOP BAR -->

    <div class="topbar">
        🎓 HIT Student Marketplace • Buy. Sell. Connect.
    </div>


    <!-- NAVBAR -->

    <nav>

        <a href="index.html" class="brand">

            <div class="brand-logo">
                HIT
            </div>

            <div class="brand-name">
                HIT Marketplace
            </div>

        </a>


        <div class="nav-right">

            <a href="marketplace.html" class="nav-btn">
                Marketplace
            </a>

            <a href="chats.html" class="nav-btn">
                💬 Chats
            </a>

            <button
                class="logout-btn"
                onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <!-- MAIN -->

    <main class="container">

        <div class="heading">

            <h1>
                My Listings 📦
            </h1>

            <p>
                Manage the products you have posted.
            </p>

        </div>


        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Listings</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active</div>
                <div class="stat-value" id="activeCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Reserved</div>
                <div class="stat-value" id="reservedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Sold</div>
                <div class="stat-value" id="soldCount">0</div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="ALL" onclick="setFilter('ALL')">All</button>
            <button class="filter-btn" data-filter="ACTIVE" onclick="setFilter('ACTIVE')">Active</button>
            <button class="filter-btn" data-filter="RESERVED" onclick="setFilter('RESERVED')">Reserved</button>
            <button class="filter-btn" data-filter="SOLD" onclick="setFilter('SOLD')">Sold</button>
        </div>

        <div
            id="listingsGrid"
            class="grid">

            <div class="message">

                <h2>
                    Loading your listings...
                </h2>

                <p>
                    Please wait.
                </p>

            </div>

        </div>

    </main>


    <script>

        /* =========================
           SUPABASE
        ========================= */

        const SUPABASE_URL =
            "https://ziyyqhnmhbwomibpsenf.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_i25Oy3Rbnzr3S45H4KzQyg_dLeEd3YH";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let currentUser = null;
        let allListings = [];
        let currentFilter = "ALL";


        /* =========================
           HTML ESCAPE
        ========================= */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================
           CHECK USER
        ========================= */

        async function checkUser() {

            const {
                data: {
                    session
                },
                error
            } =
                await supabaseClient.auth.getSession();


            if (
                error ||
                !session
            ) {

                window.location.replace(
                    "login.html"
                );

                return null;
            }


            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "verification_status"
                    )
                    .eq(
                        "id",
                        session.user.id
                    )
                    .single();


            if (
                profileError ||
                !profile
            ) {

                window.location.replace(
                    "login.html"
                );

                return null;
            }


            if (
                profile.verification_status !==
                "VERIFIED"
            ) {

                window.location.replace(
                    "verify.html"
                );

                return null;
            }


            currentUser =
                session.user;


            return session.user;

        }


        /* =========================
           LOAD MY LISTINGS
        ========================= */

        async function loadListings() {

            const user =
                await checkUser();


            if (!user) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("listings")
                    .select("*")
                    .eq(
                        "seller_id",
                        user.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(
                    error
                );


                document.getElementById(
                    "listingsGrid"
                ).innerHTML = `

                    <div class="message error">

                        <h2>
                            Could not load listings
                        </h2>

                        <p>
                            ${escapeHtml(
                                error.message
                            )}
                        </p>

                    </div>

                `;

                return;
            }


            allListings = data || [];
            updateStats(allListings);
            displayListings(allListings);

        }


        /* =========================
           STATS + FILTER
        ========================= */

        function updateStats(items) {
            document.getElementById("totalCount").textContent = items.length;
            document.getElementById("activeCount").textContent =
                items.filter(item => (item.status || "ACTIVE") === "ACTIVE").length;
            document.getElementById("reservedCount").textContent =
                items.filter(item => (item.status || "ACTIVE") === "RESERVED").length;
            document.getElementById("soldCount").textContent =
                items.filter(item => (item.status || "ACTIVE") === "SOLD").length;
        }

        function setFilter(filter) {
            currentFilter = filter;

            document.querySelectorAll(".filter-btn").forEach(button => {
                button.classList.toggle(
                    "active",
                    button.dataset.filter === filter
                );
            });

            const filtered =
                filter === "ALL"
                    ? allListings
                    : allListings.filter(
                        item => (item.status || "ACTIVE") === filter
                    );

            displayListings(filtered);
        }


        /* =========================
           DISPLAY LISTINGS
        ========================= */

        function displayListings(
            items
        ) {

            const grid =
                document.getElementById(
                    "listingsGrid"
                );


            if (!items.length) {

                grid.innerHTML = `

                    <div class="message">

                        <h2>
                            You haven't posted anything yet.
                        </h2>

                        <p>
                            Go to Marketplace and use
                            "Sell Item" to create your
                            first listing.
                        </p>

                    </div>

                `;

                return;
            }


            grid.innerHTML =
                items.map(
                    item => {

                        const image =
                            item.image_url

                                ? `

                                    <img
                                        src="${escapeHtml(
                                            item.image_url
                                        )}"
                                        alt="${escapeHtml(
                                            item.title
                                        )}"

                                        onerror="
                                            this.style.display='none';
                                            this.nextElementSibling.style.display='flex';
                                        "
                                    >

                                    <div
                                        class="no-image"
                                        style="display:none;">

                                        Image unavailable

                                    </div>

                                `

                                : `

                                    <div class="no-image">

                                        No image

                                    </div>

                                `;


                        const price =
                            Number(
                                item.price || 0
                            ).toLocaleString(
                                "en-IN"
                            );


                        const date =
                            item.created_at

                                ? new Date(
                                    item.created_at
                                ).toLocaleDateString(
                                    "en-IN",
                                    {
                                        day: "numeric",
                                        month: "short",
                                        year: "numeric"
                                    }
                                )

                                : "";


                        const status =
                            item.status ||
                            "ACTIVE";


                        let actionButtons = `

                            <button
                                class="action view"
                                onclick="
                                    viewProduct(
                                        '${item.id}'
                                    )
                                ">

                                👁 View

                            </button>

                            <button
                                class="action edit"
                                onclick="
                                    editListing(
                                        '${item.id}'
                                    )
                                ">

                                ✏️ Edit

                            </button>

                        `;


                        if (
                            status ===
                            "ACTIVE"
                        ) {

                            actionButtons += `

                                <button
                                    class="action reserve"
                                    onclick="
                                        changeStatus(
                                            '${item.id}',
                                            'RESERVED'
                                        )
                                    ">

                                    Reserve

                                </button>

                                <button
                                    class="action sold"
                                    onclick="
                                        changeStatus(
                                            '${item.id}',
                                            'SOLD'
                                        )
                                    ">

                                    Mark Sold

                                </button>

                            `;

                        }


                        if (
                            status ===
                            "RESERVED"
                        ) {

                            actionButtons += `

                                <button
                                    class="action sold"
                                    onclick="
                                        changeStatus(
                                            '${item.id}',
                                            'SOLD'
                                        )
                                    ">

                                    Mark Sold

                                </button>

                                <button
                                    class="action view"
                                    onclick="
                                        changeStatus(
                                            '${item.id}',
                                            'ACTIVE'
                                        )
                                    ">

                                    Make Active

                                </button>

                            `;

                        }


                        if (
                            status ===
                            "SOLD"
                        ) {

                            actionButtons += `

                                <button
                                    class="action view"
                                    onclick="
                                        changeStatus(
                                            '${item.id}',
                                            'ACTIVE'
                                        )
                                    ">

                                    Make Active

                                </button>

                                <button
                                    class="action reserve"
                                    onclick="
                                        changeStatus(
                                            '${item.id}',
                                            'RESERVED'
                                        )
                                    ">

                                    Reserve

                                </button>

                            `;

                        }


                        actionButtons += `

                            <button
                                class="action delete"
                                onclick="
                                    deleteListing(
                                        '${item.id}'
                                    )
                                ">

                                Delete

                            </button>

                        `;


                        return `

                            <article class="card">

                                ${image}


                                <div class="content">

                                    <span class="category">

                                        ${escapeHtml(
                                            item.category ||
                                            "Other"
                                        )}

                                    </span>


                                    <h2 class="title">

                                        ${escapeHtml(
                                            item.title
                                        )}

                                    </h2>


                                    <p class="desc">

                                        ${escapeHtml(
                                            item.description ||
                                            "No description provided."
                                        )}

                                    </p>


                                    <div class="price">

                                        ₹${price}

                                    </div>


                                    <span
                                        class="status ${escapeHtml(
                                            status
                                        )}">

                                        ${escapeHtml(
                                            status
                                        )}

                                    </span>


                                    <p
                                        style="
                                            font-size:12px;
                                            color:#94a3b8;
                                            margin-bottom:14px;
                                        ">

                                        Posted ${date}

                                    </p>


                                    <div class="actions">

                                        ${actionButtons}

                                    </div>

                                </div>

                            </article>

                        `;

                    }
                ).join("");

        }


        /* =========================
           VIEW PRODUCT
        ========================= */

        function viewProduct(
            id
        ) {

            window.location.href =
                "product.html?id=" +
                encodeURIComponent(
                    id
                );

        }


        /* =========================
           EDIT LISTING
        ========================= */

        function editListing(id) {

            window.location.href =
                "edit-listing.html?id=" +
                encodeURIComponent(id);

        }


        /* =========================
           CHANGE STATUS
        ========================= */

        async function changeStatus(
            id,
            status
        ) {

            const label =
                status === "SOLD"
                    ? "sold"
                    : status.toLowerCase();


            if (
                !confirm(
                    `Change this listing to ${label}?`
                )
            ) {

                return;
            }


            const {
                error
            } =
                await supabaseClient
                    .from("listings")
                    .update({
                        status: status
                    })
                    .eq(
                        "id",
                        id
                    )
                    .eq(
                        "seller_id",
                        currentUser.id
                    );


            if (error) {

                alert(
                    "Could not update listing: " +
                    error.message
                );

                return;
            }


            await loadListings();

            if (currentFilter !== "ALL") {
                setFilter(currentFilter);
            }

        }


        /* =========================
           DELETE LISTING
        ========================= */

        async function deleteListing(
            id
        ) {

            if (
                !confirm(
                    "Delete this listing permanently?"
                )
            ) {

                return;
            }


            const {
                error
            } =
                await supabaseClient
                    .from("listings")
                    .delete()
                    .eq(
                        "id",
                        id
                    )
                    .eq(
                        "seller_id",
                        currentUser.id
                    );


            if (error) {

                alert(
                    "Could not delete listing: " +
                    error.message
                );

                return;
            }


            await loadListings();

            if (currentFilter !== "ALL") {
                setFilter(currentFilter);
            }

        }


        /* =========================
           LOGOUT
        ========================= */

        async function logout() {

            const {
                error
            } =
                await supabaseClient.auth.signOut();


            if (error) {

                alert(
                    "Logout failed: " +
                    error.message
                );

                return;
            }


            window.location.replace(
                "login.html"
            );

        }


        /* =========================
           START
        ========================= */

        loadListings();

    </script>

</body>

</html>
